name: Enderarch Vanilla Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    services:
      docker:
        image: docker:dind
        ports: ["2375:2375"]
        options: >-
          --privileged
          -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            make \
            arch-install-scripts \
            squashfs-tools \
            mkinitcpio \
            xorriso \
            grub \
            isolinux \
            syslinux \
            e2fsprogs \
            dosfstools \
            openssl \
            perl \
            util-linux \
            kmod

      - name: Build vanilla flavour
        run: |
          make vanilla

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: enderarch-vanilla-${{ github.sha }}
          path: iso/*.iso