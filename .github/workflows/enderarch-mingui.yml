name: Enderarch MinGUI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root --privileged 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            make \
            arch-install-scripts \
            squashfs-tools \
            mkinitcpio \
            xorriso \
            grub \
            syslinux \
            e2fsprogs \
            dosfstools \
            openssl \
            perl \
            util-linux \
            kmod

      - name: Build mingui flavour
        run: |
          make mingui

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: enderarch-mingui-${{ github.sha }}
          path: iso/*.iso
