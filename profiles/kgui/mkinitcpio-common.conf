# Unified common initrd with modules from both linux and linux-lts
# Custom hook merges modules from both kernel trees

HOOKS=(base udev autodetect modconf block filesystems keyboard fsck enderarch-common)
# The enderarch-common hook provides: module merging from both kernels, binfmt setup
# No MODULES needed here — the hook handles module gathering

BINARIES=(/usr/bin/busybox)
FILES=()

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
