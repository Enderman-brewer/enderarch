# Early config embedded in GRUB core images (grub-mkimage -c).
# Runs before any external module directory is known, so only modules baked
# into the core image may be used here: udf, iso9660, fat, search, etc.
# Kept flavor-agnostic: locate media by file, not volume label.

set root=""

if ! search --no-floppy --file /boot/grub/grub.cfg --set=root; then
  # Fallback: find the device carrying the live root directly
  if ! search --no-floppy --file /LiveOS/rootfs.sfs --set=root; then
    echo "ENDERARCH: WARNING — boot media not found; dropping to GRUB shell"
    exit
  fi
fi

set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
